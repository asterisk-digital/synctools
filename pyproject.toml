[project]
name = "synctools"
version = "0.2.0"
description = "A simple Python template project"
authors = [{ name = "David Skoland", email = "david.skoland@asterisk.digital" }]
requires-python = ">=3.11"

# Only true runtime deps here
dependencies = [
  "google-cloud-bigquery>=3.35.0",  # pin or range as you prefer
  "python-dotenv>=1.0.0",
  "requests>=2.32.0",
]

[project.optional-dependencies]
# Everything used for linting, testing, building, local tooling
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.14.0",
  "tox>=4",
  "tox-uv>=1.14",
  "setuptools>=75",
  "wheel",
  "pip-review>=1.3.0",
]

# If you add CLIs later, uncomment and wire them up
# [project.scripts]
# synctools = "synctools.main:main"

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
synctools = ["*.json"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["synctools*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
exclude = ["build", "dist", "venv"]
lint.select = ["E", "F"]
