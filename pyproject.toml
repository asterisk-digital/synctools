[project]
name = "synctools"
version = "0.1.0"
description = "A simple Python template project"
authors = [{ name = "David Skoland", email = "david.skoland@asterisk.digital" }]
requires-python = ">=3.11"

dependencies = [
    "certifi>=2025.8.3",
    "charset-normalizer>=3.4.3",
    "idna>=3.10",
    "iniconfig>=2.1.0",
    "packaging>=25.0",
    "pip-review>=1.3.0",
    "pluggy>=1.6.0",
    "pytest>=8.4.1",
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
    "ruff>=0.11.11",
    "urllib3>=2.5.0",
]

# Add a console script so we can run it from the command line
#[project.scripts]
#pythontemplate = "synctools.main:main"

[tool.setuptools]
# src-layout project
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
# include synctools
include = ["synctools*"]

[project.optional-dependencies]
dev = [
    "setuptools",
    "wheel",
    "ruff",
    "tox",
    "tox-uv"
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
lint.select = ["E", "F"]
exclude = ["build", "dist", "venv"]
