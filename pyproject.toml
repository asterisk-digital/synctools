[project]
name = "synctools"
version = "0.3.0"
description = "A set of tools useful for syncing data"
authors = [{ name = "David Skoland", email = "david.skoland@asterisk.digital" }]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.14",
  "tox>=4.50",
  "tox-uv>=1.14",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["synctools*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]

[tool.tox]
env_list = ["py311", "py312", "py313"]

[tool.tox.env_run_base]
description = "Run tests with pytest"
package = "editable"
dependency_groups = ["dev"]
commands = [["pytest", "{posargs:tests}"]]

[tool.ruff]
line-length = 120
exclude = ["build", "dist", "venv"]
lint.select = ["E", "F"]
