[project]
name = "synctools"
version = "0.2.0"
description = "A simple Python template project"
authors = [{ name = "David Skoland", email = "david.skoland@asterisk.digital" }]
requires-python = ">=3.11"

dependencies = [
  "google-cloud-bigquery>=3.35",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.14",
  "tox>=4.50",
  "tox-uv>=1.14",
]

# If you add CLIs later, uncomment and wire them up
# [project.scripts]
# synctools = "synctools.main:main"

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["synctools*"]

[tool.setuptools.package-data]
synctools = ["*.json"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]

[tool.tox]
env_list = ["py311"]

[tool.tox.env_run_base]
description = "Run tests with pytest"
package = "editable"
dependency_groups = ["dev"]
set_env = { PYTHONPATH = "{toxinidir}/src" }
commands = [["pytest", "{posargs:tests}"]]

[tool.ruff]
line-length = 120
exclude = ["build", "dist", "venv"]
lint.select = ["E", "F"]
